# Single source of truth for the entire 2x2 experiment.
seed: 42
test_size: 0.25

datasets:
  churn:
    path: data/raw/churn.csv          # e.g. Telco Customer Churn (Kaggle/IBM)
    target: Churn
    positive_label: "Yes"
    primary_metric: roc_auc
  fraud:
    path: data/raw/creditcard.csv     # e.g. ULB Credit Card Fraud (Kaggle)
    target: Class
    positive_label: 1
    primary_metric: pr_auc            # ROC-AUC misleading at 0.1% prevalence

models:
  logistic_regression:
    max_iter: 2000
    class_weight: balanced
  xgboost:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    # scale_pos_weight is computed at train time for the fraud domain

perturbation:
  numerical_levels: [0.05, 0.10, 0.20]   # +/- multiplicative noise magnitudes
  categorical_swap_probs: [0.05, 0.10, 0.20]
  n_trials: 20                            # Monte Carlo repetitions per noise level
  metrics: [roc_auc, f1, pr_auc]

output:
  models_dir: outputs/models
  results_dir: outputs/results
  figures_dir: outputs/figures
